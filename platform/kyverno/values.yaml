# Kyverno Helm values (chart 3.9.1, Kyverno v1.19.1)
# Single replicas: on one physical host HA adds memory, not availability.
# The chart's default resource requests and limits are kept; they fit this cluster.

admissionController:
  replicas: 1
  # Keep off the control plane, which ran short of memory once the Kyverno CRDs
  # were loaded into the API server (second guard next to the control-plane taint)
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
  serviceMonitor:
    enabled: true

backgroundController:
  replicas: 1
  serviceMonitor:
    enabled: true

reportsController:
  replicas: 1
  serviceMonitor:
    enabled: true

# Exceptions are only honoured in the kyverno namespace, which only platform
# admins can write to; application teams cannot exempt themselves
features:
  policyExceptions:
    enabled: true
    namespace: kyverno

# Deletes resources on a schedule (ClusterCleanupPolicy); not used here
cleanupController:
  enabled: false

# The kyverno-api subchart (policies.kyverno.io CRDs) renders `labels: {}` by default.
# The API server drops empty maps, so Argo CD saw these CRDs as permanently OutOfSync.
kyverno-api:
  labels:
    app.kubernetes.io/part-of: kyverno

# Ship the Kyverno dashboard as a ConfigMap; the Grafana sidecar picks it up
# from any namespace via the grafana_dashboard label
grafana:
  enabled: true
