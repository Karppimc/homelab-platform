# Metrics stack: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# node-exporter and kube-state-metrics. Values live in platform/monitoring/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.3.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/platform/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/karppimc/homelab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Prometheus Operator CRDs are too large for client-side apply annotations
      - ServerSideApply=true
