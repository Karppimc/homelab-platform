# Cluster policies (Kyverno ValidatingPolicy). Kept separate from the Kyverno
# install so policies can be changed or rolled back without touching the engine.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/karppimc/homelab-platform.git
    targetRevision: main
    path: platform/policies
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
