# Argo CD manages its own Helm release: chart from the Argo Helm repo,
# values from this Git repo. Upgrade by bumping targetRevision here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.10.2
      helm:
        releaseName: argocd
        valueFiles:
          - $values/platform/argocd/values.yaml
    - repoURL: https://github.com/karppimc/homelab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    # No pruning: a bad commit must not be able to delete Argo CD itself
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # Argo CD CRDs are too large for client-side apply annotations
      - ServerSideApply=true
