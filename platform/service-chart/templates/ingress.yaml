{{- with .Values.ingress.host }}
# Published on the LAN at https://{{ . }}. HTTPS only: the route is attached to
# Traefik's websecure entry point, and cert-manager issues the certificate from
# the platform CA (which signs only *.home.arpa names)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Values.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: {{ $.Values.name }}-tls
      hosts:
        - {{ . }}
  rules:
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.name }}
                port:
                  name: http
{{- end }}
