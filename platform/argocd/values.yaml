# Argo CD Helm values (chart argo-cd 10.10.2, Argo CD v3.5.4)
# Single replicas and tight resources: the whole platform runs on one 16 GB host.

# SSO is not needed; log in with the built-in admin user
dex:
  enabled: false

# Not used yet; re-enable when alerts are needed
notifications:
  enabled: false

configs:
  params:
    # Traefik terminates TLS; Argo CD serves plain HTTP inside the cluster
    server.insecure: true

# Helm hook Job that generates the Redis password on every sync; without limits the
# require-memory-limits policy would reject it and Argo CD could not sync itself
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

controller:
  replicas: 1
  # Caches every managed resource; 512Mi was OOMKilled once kube-prometheus-stack was added
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

server:
  replicas: 1
  # LAN only; the hostname resolves via local hosts files, not public DNS
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.home.arpa
    tls: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

repoServer:
  replicas: 1
  # Idles around 30Mi but renders several charts at once after a push;
  # 256Mi was OOMKilled when the Loki and Alloy charts were added
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
