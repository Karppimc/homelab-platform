# kube-prometheus-stack Helm values (chart 92.3.0)
# Sized for a 3-node homelab: 7 days of metrics, single replicas, memory limits everywhere.

# k3s runs the controller-manager, scheduler and kube-proxy inside the k3s process with
# metrics bound to localhost, and a single server uses SQLite instead of etcd. Scraping
# them would only produce permanently failing targets and alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # Pick up ServiceMonitors, PodMonitors and rules from every namespace, not just
    # ones labelled for this Helm release: this is what makes monitoring opt-in per app
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # k3s does not taint the control plane; keep the largest, growing workload off it
    # so it cannot starve the API server of memory
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

prometheusOperator:
  # Helm hook Jobs that create and patch the operator's webhook certificate on every
  # sync; without limits the require-memory-limits policy would reject them
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  # Sidecar and init container the operator injects into Prometheus and Alertmanager;
  # without this they run with no memory request or limit
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # The chart default only tolerates NoSchedule taints; the control plane is tainted
  # CriticalAddonsOnly=true:NoExecute, which evicted node-exporter from it
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

grafana:
  # The chart would generate a random password on every render under Argo CD
  # (no Helm lookup), so the Secret is created once by ansible/playbooks/bootstrap-secrets.yml
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  # Dashboards and data sources are provisioned from code; no persistent volume needed
  persistence:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.home.arpa
    tls:
      - hosts:
          - grafana.home.arpa
  # Sidecars load dashboards and data sources from ConfigMaps
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  # Keep off the untainted k3s control plane
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  # Idles around 300Mi; large Explore queries (hundreds of series) were OOMKilled at 384Mi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
