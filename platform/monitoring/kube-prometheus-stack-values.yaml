# kube-prometheus-stack Helm values (chart 92.3.0)
# Sized for a 3-node homelab: 7 days of metrics, single replicas, memory limits everywhere.

# k3s runs the controller-manager, scheduler and kube-proxy inside the k3s process with
# metrics bound to localhost, and a single server uses SQLite instead of etcd. Scraping
# them would only produce permanently failing targets and alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false

prometheus:
  prometheusSpec:
    # The operator builds the pods from this resource; the chart labels the resource
    # but not the pods, and require-standard-labels asks for part-of on them too
    podMetadata:
      labels:
        app.kubernetes.io/part-of: kube-prometheus-stack
    retention: 7d
    retentionSize: 8GB
    # Pick up ServiceMonitors, PodMonitors and rules from every namespace, not just
    # ones labelled for this Helm release: this is what makes monitoring opt-in per app
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # k3s does not taint the control plane; keep the largest, growing workload off it
    # so it cannot starve the API server of memory
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  # Everything goes to one Discord channel, except the alerts that exist only for
  # machines: Watchdog (always firing, proves the pipeline is alive), InfoInhibitor
  # and info-level alerts. The chart's default inhibit rules stay in place
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
        - receiver: "null"
          matchers:
            - severity = "info"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          # The webhook URL is a secret: it comes from the Secret mounted below,
          # created by ansible/playbooks/bootstrap-secrets.yml from Ansible Vault
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
            # Templates in templateFiles below; tested by scripts/check-alertmanager.py
            title: '{{ template "discord.platform.title" . }}'
            message: '{{ template "discord.platform.message" . }}'
  # Alertmanager's default Discord message lists every label of every alert. These
  # templates show what is broken, where, how bad and since when. The chart mounts
  # them in /etc/alertmanager/config/, which its default config.templates reads
  templateFiles:
    discord.tmpl: |-
      {{/*
        Discord messages for platform alerts. Title: status, alert count, name and
        where. Message: one short block per alert with the labels that say where the
        problem is, never the scrape labels (the exporter's pod, endpoint,
        prometheus...). At most six alerts are listed: a Discord embed description
        holds 4096 characters.

        Alerts from node-exporter are about a node, not about the namespace and pod
        that node-exporter itself runs in, so for them the node (instance) is shown.
      */}}

      {{ define "discord.platform.title" -}}
      {{ if eq .Status "firing" -}}
      [FIRING{{ if gt (len .Alerts.Firing) 1 }}:{{ len .Alerts.Firing }}{{ end }}]
      {{- else -}}
      [RESOLVED]
      {{- end }} {{ .CommonLabels.alertname }}
      {{- if eq .CommonLabels.job "node-exporter" }}
      {{- with .CommonLabels.instance }} · {{ . }}{{ end }}
      {{- else }}
      {{- with .CommonLabels.namespace }} · {{ . }}{{ end }}
      {{- end }}
      {{- end }}

      {{ define "discord.platform.where" -}}
      {{ if eq .Labels.job "node-exporter" -}}
      {{ range $key := stringSlice "instance" "mountpoint" "device" -}}
      {{ with index $.Labels $key }}`{{ $key }}={{ . }}` {{ end -}}
      {{ end -}}
      {{ else -}}
      {{ range $key := stringSlice
          "namespace" "resource_namespace" "name" "pod" "container" "node"
          "persistentvolumeclaim" "policy_name" "resource_kind" -}}
      {{ with index $.Labels $key }}`{{ $key }}={{ . }}` {{ end -}}
      {{ end -}}
      {{ end -}}
      {{ end }}

      {{ define "discord.platform.alert" -}}
      **{{ if eq .Status "resolved" }}Resolved: {{ end }}{{ or .Annotations.summary .Labels.alertname }}**
      {{ with .Annotations.description }}{{ . }}
      {{ end -}}
      {{ template "discord.platform.where" . }}· {{ or .Labels.severity "no severity" }}
      {{- " · since " }}{{ .StartsAt.UTC.Format "2006-01-02 15:04 UTC" }}
      {{- with .Annotations.runbook_url }} · [runbook]({{ . }}){{ end }}
      {{- end }}

      {{ define "discord.platform.message" -}}
      {{ range $i, $alert := .Alerts -}}
      {{ if lt $i 6 }}{{ if $i }}

      {{ end }}{{ template "discord.platform.alert" $alert }}{{ end -}}
      {{ end -}}
      {{ if gt (len .Alerts) 6 }}

      Showing 6 of {{ len .Alerts }} alerts in this group; the rest are in Alertmanager.{{ end }}
      {{- end }}

prometheusOperator:
  # cert-manager issues the operator's webhook certificate (a self-signed issuer in
  # this namespace: the platform CA is constrained to home.arpa and cannot sign a
  # cluster-internal service name) and injects the CA into the webhook configuration.
  # This replaces the two Helm hook Jobs that did the same on every sync and raced
  # with Argo CD's hook tracking
  admissionWebhooks:
    certManager:
      enabled: true
  # Sidecar and init container the operator injects into Prometheus and Alertmanager;
  # without this they run with no memory request or limit
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # The chart default only tolerates NoSchedule taints; the control plane is tainted
  # CriticalAddonsOnly=true:NoExecute, which evicted node-exporter from it
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

grafana:
  # The Grafana subchart sets neither part-of nor managed-by. extraLabels go on
  # every Grafana resource, podLabels on the pods (require-standard-labels)
  extraLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
  podLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
  # The chart would generate a random password on every render under Argo CD
  # (no Helm lookup), so the Secret is created once by ansible/playbooks/bootstrap-secrets.yml
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc:3100
      access: proxy
  # Dashboards and data sources are provisioned from code; no persistent volume needed
  persistence:
    enabled: false
  ingress:
    enabled: true
    ingressClassName: traefik
    # cert-manager issues the certificate into the Secret named under tls
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca
    hosts:
      - grafana.home.arpa
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.home.arpa
  # Sidecars load dashboards and data sources from ConfigMaps
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  # Keep off the untainted k3s control plane
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  # Idles around 300Mi; large Explore queries (hundreds of series) were OOMKilled at 384Mi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
