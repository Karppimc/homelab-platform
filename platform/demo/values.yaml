# podinfo Helm values (chart 6.15.0)

replicaCount: 2

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

serviceMonitor:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  # The image sets USER app (by name), which the kubelet cannot verify as non-root;
  # pin the numeric ids the image already uses
  runAsUser: 100
  runAsGroup: 101

