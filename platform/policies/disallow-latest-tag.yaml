# Images must be pinned to a tag other than latest (or to a digest), so a rebuild
# or reschedule always runs the same code.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow untagged and latest images
    policies.kyverno.io/severity: medium
spec:
  # Deny: reject violating resources at admission. Audit: keep recording PolicyReports.
  # Fail closed: if Kyverno is down, matching resources are rejected rather than
  # admitted unchecked (kube-system and kyverno are excluded, so the cluster can recover)
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno]
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    # Look only at the last path segment, so a registry port (host:5000/app) is not
    # mistaken for a tag
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@') ||
          (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') &&
           !c.image.endsWith(':latest')))
      message: Every image must be pinned to a version tag or digest; untagged images and ':latest' are not allowed.
