# Workloads must carry the standard app.kubernetes.io labels (name, part-of,
# managed-by), so every resource can be traced to its application, the system
# it belongs to and the tool that manages it.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-standard-labels
  annotations:
    policies.kyverno.io/title: Require standard labels
    policies.kyverno.io/severity: medium
spec:
  # Deny: reject violating resources at admission. Audit: keep recording PolicyReports.
  # The policy ran in Audit first; it was switched once the reports were clean (#27).
  # Fail closed: if Kyverno is down, matching resources are rejected rather than
  # admitted unchecked (the namespaces below are excluded, so the cluster can recover)
  failurePolicy: Fail
  validationActions: [Deny, Audit]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      # The controllers are matched by name, which turns Kyverno's autogen off for
      # this policy: the rule below checks their pod template itself
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      # Jobs too, Helm hook Jobs included: a Job whose pods would be rejected is
      # created fine and then never completes, which blocks an Argo CD sync without
      # an error. Rejecting the Job itself fails loudly
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kyverno]
  variables:
    - name: required
      expression: >-
        ['app.kubernetes.io/name', 'app.kubernetes.io/part-of', 'app.kubernetes.io/managed-by']
    - name: labels
      expression: object.metadata.?labels.orValue({})
    # A Pod has no pod template; for a controller these are the labels its pods get
    - name: templateLabels
      expression: >-
        object.kind == 'Pod' ? {} :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.?metadata.?labels.orValue({}) :
        object.spec.template.?metadata.?labels.orValue({})
    # The Jobs of a CronJob get their labels from its job template, not from the CronJob
    - name: jobTemplateLabels
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.?metadata.?labels.orValue({}) : {}
  validations:
    - expression: >-
        variables.required.all(l, l in variables.labels && variables.labels[l] != '')
      message: >-
        Set the labels app.kubernetes.io/name, app.kubernetes.io/part-of and
        app.kubernetes.io/managed-by, each with a non-empty value, in metadata.labels.
    # Caught on the controller, so the author sees it before the pods are created
    - expression: >-
        object.kind == 'Pod' ||
        variables.required.all(l, l in variables.templateLabels && variables.templateLabels[l] != '')
      message: >-
        Set the labels app.kubernetes.io/name, app.kubernetes.io/part-of and
        app.kubernetes.io/managed-by, each with a non-empty value, in the pod template's
        metadata.labels as well: pods get their labels from the pod template.
    - expression: >-
        object.kind != 'CronJob' ||
        variables.required.all(l, l in variables.jobTemplateLabels && variables.jobTemplateLabels[l] != '')
      message: >-
        Set the labels app.kubernetes.io/name, app.kubernetes.io/part-of and
        app.kubernetes.io/managed-by, each with a non-empty value, in
        spec.jobTemplate.metadata.labels as well: the Jobs of a CronJob get their labels from there.
