# Create in-cluster Secrets that must never be committed (the repo is public).
# Generated Secrets (Grafana admin) get a random value once and are left alone on
# re-runs. Secrets that come from Ansible Vault (the Alertmanager Discord webhook)
# are applied on every run, so a rotated value in the vault reaches the cluster.
# Read a value with: kubectl -n <ns> get secret <name> -o jsonpath='{.data.<key>}' | base64 -d
- name: Bootstrap platform secrets
  hosts: localhost
  connection: local
  gather_facts: false
  # localhost is not in the k3s_cluster group, so its vault is loaded explicitly
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/k3s_cluster/vault.yml"
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
  tasks:
    - name: Ensure monitoring namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: monitoring
        state: present

    - name: Check for existing Grafana admin Secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: monitoring
        name: grafana-admin
      register: grafana_admin_secret
      no_log: true

    - name: Create Grafana admin Secret with a random password
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: monitoring
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: >-
              {{ lookup('ansible.builtin.password', '/dev/null', length=32,
                        chars=['ascii_letters', 'digits']) }}
      when: grafana_admin_secret.resources | length == 0
      no_log: true

    # Alertmanager mounts this Secret and reads the webhook URL from the file; it
    # does not start without it. Add the value with:
    #   ansible-vault edit inventory/group_vars/k3s_cluster/vault.yml
    - name: Check that the vault has the Discord webhook URL for Alertmanager
      ansible.builtin.assert:
        that:
          - vault_alertmanager_discord_webhook_url is defined
          - vault_alertmanager_discord_webhook_url is match('^https://discord(app)?\\.com/api/webhooks/')
        fail_msg: >-
          Set vault_alertmanager_discord_webhook_url in the vault to a Discord webhook URL
          (https://discord.com/api/webhooks/...).
        quiet: true

    - name: Create or update the Alertmanager Discord webhook Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: alertmanager-discord
            namespace: monitoring
          type: Opaque
          stringData:
            webhook-url: "{{ vault_alertmanager_discord_webhook_url }}"
      no_log: true
