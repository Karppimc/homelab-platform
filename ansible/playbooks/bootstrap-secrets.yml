# Create in-cluster Secrets that must never be committed (the repo is public).
# Generated Secrets (Grafana admin) get a random value once and are left alone on
# re-runs. Secrets that come from Ansible Vault (the Alertmanager Discord webhook)
# or from files on the workstation (the local CA) are applied on every run, so a
# rotated value reaches the cluster and a rebuilt cluster gets the same CA back.
# Read a value with: kubectl -n <ns> get secret <name> -o jsonpath='{.data.<key>}' | base64 -d
- name: Bootstrap platform secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
    # The local CA lives outside the repo, like the vault password. Back up ca.key
    ca_dir: "{{ lookup('env', 'HOME') }}/.homelab-ca"
  tasks:
    - name: Ensure monitoring namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: monitoring
        state: present

    - name: Check for existing Grafana admin Secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: monitoring
        name: grafana-admin
      register: grafana_admin_secret
      no_log: true

    - name: Create Grafana admin Secret with a random password
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: monitoring
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: >-
              {{ lookup('ansible.builtin.password', '/dev/null', length=32,
                        chars=['ascii_letters', 'digits']) }}
      when: grafana_admin_secret.resources | length == 0
      no_log: true

    # Alertmanager mounts this Secret and reads the webhook URL from the file; it
    # does not start without it. Add the value with:
    #   ansible-vault edit inventory/group_vars/k3s_cluster/vault.yml
    # localhost is not in the k3s_cluster group, so its vault is loaded explicitly.
    # As a task, not vars_files: a syntax check must not need the vault password
    # (CI lints with a placeholder password and never decrypts the vault)
    - name: Load the vault
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventory/group_vars/k3s_cluster/vault.yml"
      no_log: true

    - name: Check that the vault has the Discord webhook URL for Alertmanager
      ansible.builtin.assert:
        that:
          - vault_alertmanager_discord_webhook_url is defined
          - vault_alertmanager_discord_webhook_url is match('^https://discord(app)?\\.com/api/webhooks/')
        fail_msg: >-
          Set vault_alertmanager_discord_webhook_url in the vault to a Discord webhook URL
          (https://discord.com/api/webhooks/...).
        quiet: true

    - name: Create or update the Alertmanager Discord webhook Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: alertmanager-discord
            namespace: monitoring
          type: Opaque
          stringData:
            webhook-url: "{{ vault_alertmanager_discord_webhook_url }}"
      no_log: true

    # The platform's own CA: cert-manager signs the Ingress certificates with it.
    # It is created once on the workstation and reused, so it survives a cluster
    # rebuild and has to be trusted on a device only once.
    - name: Ensure the local CA directory exists
      ansible.builtin.file:
        path: "{{ ca_dir }}"
        state: directory
        mode: "0700"

    - name: Create the local CA private key
      community.crypto.openssl_privatekey:
        path: "{{ ca_dir }}/ca.key"
        type: ECC
        curve: secp256r1
        mode: "0600"

    # Name-constrained to home.arpa: a device that trusts this CA accepts its
    # certificates for platform names only, never for other sites
    - name: Create a signing request for the local CA certificate
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ ca_dir }}/ca.key"
        common_name: Homelab Platform Local CA
        organization_name: homelab-platform
        basic_constraints:
          - CA:TRUE
          - pathlen:0
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
        key_usage_critical: true
        name_constraints_permitted:
          - DNS:home.arpa
        name_constraints_critical: true
      register: local_ca_csr
      changed_when: false

    - name: Create the local CA certificate (valid for 10 years)
      community.crypto.x509_certificate:
        path: "{{ ca_dir }}/ca.crt"
        csr_content: "{{ local_ca_csr.csr }}"
        privatekey_path: "{{ ca_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
        mode: "0644"

    - name: Ensure cert-manager namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: cert-manager
        state: present

    # A ClusterIssuer reads its CA from a Secret in cert-manager's own namespace
    - name: Create or update the local CA Secret for cert-manager
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: homelab-ca
            namespace: cert-manager
          type: kubernetes.io/tls
          stringData:
            tls.crt: "{{ lookup('ansible.builtin.file', ca_dir + '/ca.crt') }}"
            tls.key: "{{ lookup('ansible.builtin.file', ca_dir + '/ca.key') }}"
      no_log: true
