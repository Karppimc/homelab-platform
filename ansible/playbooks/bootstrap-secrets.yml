# Create in-cluster Secrets that must never be committed (the repo is public).
# Each Secret is generated once with a random value and left alone on re-runs.
# Read a value with: kubectl -n <ns> get secret <name> -o jsonpath='{.data.<key>}' | base64 -d
- name: Bootstrap platform secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/homelab.yaml"
  tasks:
    - name: Ensure monitoring namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: monitoring
        state: present

    - name: Check for existing Grafana admin Secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Secret
        namespace: monitoring
        name: grafana-admin
      register: grafana_admin_secret
      no_log: true

    - name: Create Grafana admin Secret with a random password
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: monitoring
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      when: grafana_admin_secret.resources | length == 0
      no_log: true
