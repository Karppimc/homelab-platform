- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: curl
        update_cache: true

- name: Install k3s server
  hosts: server
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_TOKEN="{{ k3s_token }}" \
          sh -s - server --tls-san {{ ansible_host }}
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s
      no_log: true

    - name: Wait for server node to be Ready
      ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }}
      register: node_status
      until: "' Ready' in node_status.stdout"
      retries: 30
      delay: 5
      changed_when: false

- name: Join agents
  hosts: agent
  become: true
  tasks:
    - name: Install k3s agent
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ k3s_server_ip }}:6443" \
          K3S_TOKEN="{{ k3s_token }}" \
          sh -s - agent
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s
      no_log: true

- name: Fetch kubeconfig
  hosts: server
  become: true
  tasks:
    - name: Read kubeconfig from server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true

    # Rewrite the server address in memory so the local file is written once
    # and re-runs report ok instead of changed
    - name: Write kubeconfig to workstation
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443') }}"
        dest: "{{ k3s_kubeconfig_local }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true