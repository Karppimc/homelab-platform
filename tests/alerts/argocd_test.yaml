# Unit tests for platform/alerts/argocd.yaml, run by scripts/check-alert-rules.py
# (promtool test rules). rules/argocd.yaml is extracted from the PrometheusRule.
rule_files:
  - rules/argocd.yaml
evaluation_interval: 1m

tests:
  - name: a healthy, synced application raises nothing
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="demo", project="demo", health_status="Healthy", sync_status="Synced"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: ArgoCDAppDegraded
        exp_alerts: []
      - eval_time: 30m
        alertname: ArgoCDAppOutOfSync
        exp_alerts: []
      - eval_time: 30m
        alertname: ArgoCDAppMetricsAbsent
        exp_alerts: []

  - name: Degraded fires only after 10 minutes
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="demo", project="demo", health_status="Degraded", sync_status="Synced"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: ArgoCDAppDegraded
        exp_alerts: []
      - eval_time: 11m
        alertname: ArgoCDAppDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              name: demo
              project: demo
              health_status: Degraded
              sync_status: Synced
            exp_annotations:
              summary: Argo CD application demo is degraded
              description: >-
                Application demo (project demo) has reported
                health Degraded for 10 minutes: a workload it deploys is failing.

  - name: a short Degraded blip during a rollout does not fire
    interval: 1m
    input_series:
      # Degraded for 5 minutes, then Healthy: the series changes its labels
      - series: 'argocd_app_info{name="demo", project="demo", health_status="Degraded", sync_status="Synced"}'
        values: '1x5 stale'
      - series: 'argocd_app_info{name="demo", project="demo", health_status="Healthy", sync_status="Synced"}'
        values: '_x6 1x24'
    alert_rule_test:
      - eval_time: 20m
        alertname: ArgoCDAppDegraded
        exp_alerts: []

  - name: the alert names the application, not the Argo CD controller it was scraped from
    interval: 1m
    input_series:
      - series: >-
          argocd_app_info{name="demo", project="demo", namespace="argocd", health_status="Degraded",
          sync_status="Synced", pod="argocd-application-controller-0", container="application-controller",
          instance="10.42.3.42:8082", job="argocd-application-controller-metrics",
          dest_server="https://kubernetes.default.svc"}
        values: '1x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: ArgoCDAppDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              name: demo
              project: demo
              namespace: argocd
              health_status: Degraded
              sync_status: Synced
            exp_annotations:
              summary: Argo CD application demo is degraded
              description: >-
                Application demo (project demo) has reported
                health Degraded for 10 minutes: a workload it deploys is failing.

  - name: OutOfSync fires only after 15 minutes
    interval: 1m
    input_series:
      - series: >-
          argocd_app_info{name="reference", project="reference", health_status="Healthy",
          sync_status="OutOfSync"}
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: ArgoCDAppOutOfSync
        exp_alerts: []
      - eval_time: 16m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              severity: warning
              name: reference
              project: reference
              health_status: Healthy
              sync_status: OutOfSync
            exp_annotations:
              summary: Argo CD application reference is out of sync
              description: >-
                Application reference (project reference) has been OutOfSync
                for 15 minutes: Git and the cluster differ and the sync does not close the gap.

  - name: missing application metrics fire after 15 minutes
    interval: 1m
    # No argocd_app_info at all: the scrape is broken or the metrics are switched off
    input_series:
      - series: 'up{job="something-else"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: ArgoCDAppMetricsAbsent
        exp_alerts: []
      - eval_time: 16m
        alertname: ArgoCDAppMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Argo CD application metrics are missing
              description: >-
                Prometheus has had no argocd_app_info series for 15 minutes, so the Argo CD
                application alerts cannot fire. Check the application controller and its ServiceMonitor.
